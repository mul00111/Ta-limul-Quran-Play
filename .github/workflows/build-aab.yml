name: Build Android App Bundle (.aab)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Android Assets
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build Android Bundle (.aab)
        working-directory: android
        run: |
          gradle bundleRelease -x lint -x test --continue || {
            echo "================== EXACT ROOT CAUSE ERROR =================="
            gradle bundleRelease -x lint -x test 2>&1 | grep -E -A 5 -B 2 "(FAILURE:|What went wrong|Execution failed|Compilation failed|error:)"
            echo "============================================================"
            exit 1
          }

      - name: Upload .aab Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
